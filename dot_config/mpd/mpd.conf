### directories ###
music_directory "$XDG_MUSIC_DIR"
playlist_directory "~/.mpd/playlists"
db_file "~/.mpd/database"
state_file "~/.mpd/state"

#log_file "~/.mpd/log" # unecessary w/ systemd
#pid_file "~/.mpd/pid" # unecessary w/ systemd
#sticker_file "~/.mpd/sticker.sql"

### behavior ###
user "anarxa"
bind_to_address "any"
log_level "error"
restore_paused "yes"
save_absolute_paths_in_playlists "no"
metadata_to_use "artist,album,albumartist,title,track,date,disc"
auto_update "yes"
follow_inside_symlinks "yes"
input {
	plugin "curl"
#	proxy "proxy.isp.com:8080"
#	proxy_user "user"
#	proxy_password "password"
}
decoder {
	plugin "ffmpeg"
	enabled "yes"
}
max_playlist_length "16777203"
max_output_buffer_size "16777203"
audio_buffer_size "16384"
max_output_buffer_size "32768"
replaygain "off"
filesystem_charset "UTF-8"

#password "password@read,add,control,admin"
#default_permissions "read,add,control,admin"
#bind_to_address "~/.mpd/socket" # unecessary w/ systemd
#port "6600"
#metadata_to_use "+comment"
#auto_update_depth "3"
#follow_outside_symlinks "yes"
#database {
#	plugin "simple"
#	path "~/.local/share/mpd/db"
#	cache_directory "~/.local/share/mpd/cache"
#}

### output ###

audio_output {
	type "pipewire"
	name "Pipewire Sound Server"
}

audio_output {
	type "fifo"
	name "mpd-fifo"
	path "/tmp/mpd.fifo"
	format "44100:16:2"
}

